<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbreak 3D - Pahlawan Penyelamat</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0710; overflow: hidden; }
  canvas { display: block; }
  #label {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center;
    color: #ffd9e3; font: 600 18px system-ui, sans-serif; letter-spacing: .5px;
    text-shadow: 0 0 12px rgba(255,80,120,.6); pointer-events: none;
  }
  #hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    color: #b98ca0; font: 13px system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<div id="label"></div>
<div id="hint">Geser (drag) untuk memutar kamera &bull; scroll untuk zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= Scene dasar =================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0710, 0.01);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.PointLight(0xff4d6d, 1.5, 250);
key.position.set(25, 25, 40);
scene.add(key);
const rim = new THREE.PointLight(0x5fd0ff, 1.1, 250);
rim.position.set(-40, 0, -20);
scene.add(rim);
const healLight = new THREE.PointLight(0xffc864, 0, 120);
healLight.position.set(0, 3, 12);
scene.add(healLight);

// ================= Hati =================
const crack = [[0, 5], [1.8, 1], [-1.8, -3], [1.4, -7], [-1.4, -11], [0, -17]];
function heartPoint(t) {
  return new THREE.Vector2(
    16 * Math.pow(Math.sin(t), 3),
    13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
  );
}
function makeHalf(side) {
  const pts = [], N = 60;
  if (side === 'right') {
    for (let i = 0; i <= N; i++) pts.push(heartPoint((i / N) * Math.PI));
    for (let i = crack.length - 2; i >= 1; i--) pts.push(new THREE.Vector2(crack[i][0], crack[i][1]));
  } else {
    for (let i = 0; i <= N; i++) pts.push(heartPoint(Math.PI + (i / N) * Math.PI));
    for (let i = 1; i <= crack.length - 2; i++) pts.push(new THREE.Vector2(crack[i][0], crack[i][1]));
  }
  const geo = new THREE.ExtrudeGeometry(new THREE.Shape(pts), {
    depth: 5, bevelEnabled: true, bevelThickness: 1.2, bevelSize: 1,
    bevelSegments: 5, curveSegments: 24
  });
  geo.translate(0, 6, -2.5);
  return geo;
}
const heartMat = new THREE.MeshStandardMaterial({
  color: 0xe0143c, metalness: 0.35, roughness: 0.3,
  emissive: 0x3a0010, emissiveIntensity: 0.6
});
const left = new THREE.Mesh(makeHalf('left'), heartMat);
const right = new THREE.Mesh(makeHalf('right'), heartMat);
const heart = new THREE.Group();
heart.add(left, right);
heart.scale.setScalar(0.9);
scene.add(heart);

// ================= Serpihan =================
const SHARDS = 140;
const shards = new THREE.InstancedMesh(new THREE.TetrahedronGeometry(0.5), heartMat, SHARDS);
scene.add(shards);
const sd = [];
for (let i = 0; i < SHARDS; i++) {
  sd.push({
    x: (Math.random() - 0.5) * 5, y: -14 + Math.random() * 20, z: (Math.random() - 0.5) * 5,
    vx: (Math.random() - 0.5) * 0.03, vy: -0.015 - Math.random() * 0.04, vz: (Math.random() - 0.5) * 0.03,
    rx: Math.random() * 6, ry: Math.random() * 6, s: 0.4 + Math.random() * 1.1,
    tx: (Math.random() - 0.5) * 5, ty: 2 + Math.random() * 5, tz: (Math.random() - 0.5) * 3
  });
}
const dummy = new THREE.Object3D();

// ================= Bintang latar =================
{
  const g = new THREE.BufferGeometry(), p = [];
  for (let i = 0; i < 700; i++) p.push((Math.random() - 0.5) * 260, (Math.random() - 0.5) * 200, -30 - Math.random() * 90);
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffb3c6, size: 0.55, transparent: true, opacity: 0.6 })));
}

// ================= Pahlawan orisinal "Nova Kiko" =================
// Desain sendiri: zirah teal, aksen emas, visor cyan, jubah gelap, lambang berlian emas.
const M = {
  suit:  new THREE.MeshStandardMaterial({ color: 0x12b5a6, metalness: 0.4, roughness: 0.4 }),
  dark:  new THREE.MeshStandardMaterial({ color: 0x1b2a41, metalness: 0.3, roughness: 0.5 }),
  gold:  new THREE.MeshStandardMaterial({ color: 0xffc53d, metalness: 0.7, roughness: 0.25, emissive: 0x4a3200 }),
  visor: new THREE.MeshBasicMaterial({ color: 0x7df9ff }),
  cape:  new THREE.MeshStandardMaterial({ color: 0x24305e, metalness: 0.1, roughness: 0.7, side: THREE.DoubleSide })
};
const hero = new THREE.Group();
function add(parent, geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
}
// torso & kepala
add(hero, new THREE.CylinderGeometry(1.9, 1.4, 5, 16), M.suit, 0, 8, 0);
add(hero, new THREE.BoxGeometry(3.2, 0.7, 2.2), M.gold, 0, 5.7, 0);           // sabuk
const emblem = add(hero, new THREE.OctahedronGeometry(0.8), M.gold, 0, 9, 1.5);
emblem.scale.set(0.8, 1.2, 0.5);
add(hero, new THREE.SphereGeometry(1.6, 24, 18), M.dark, 0, 12.3, 0);          // helm
add(hero, new THREE.BoxGeometry(2.4, 0.7, 0.7), M.visor, 0, 12.4, 1.25);       // visor
add(hero, new THREE.ConeGeometry(0.5, 2, 8), M.gold, 0, 14.4, -0.2);           // sirip helm
// kaki (pivot di pinggul)
function makeLeg(x) {
  const g = new THREE.Group(); g.position.set(x, 5.5, 0);
  add(g, new THREE.CylinderGeometry(0.75, 0.6, 5.5, 12), M.suit, 0, -2.75, 0);
  add(g, new THREE.BoxGeometry(1.5, 0.9, 2.2), M.gold, 0, -5.2, 0.3);
  hero.add(g); return g;
}
const legL = makeLeg(-0.9), legR = makeLeg(0.9);
// lengan (pivot di bahu)
function makeArm(x) {
  const g = new THREE.Group(); g.position.set(x, 10.4, 0);
  add(g, new THREE.CylinderGeometry(0.55, 0.5, 4.4, 12), M.suit, 0, -2.2, 0);
  add(g, new THREE.SphereGeometry(0.75, 12, 10), M.gold, 0, -4.5, 0);
  const hand = new THREE.Object3D(); hand.position.set(0, -4.6, 0); g.add(hand);
  hero.add(g); return { g, hand };
}
const armL = makeArm(-2.3), armR = makeArm(2.3);
// jubah
const capeGeo = new THREE.PlaneGeometry(5, 8, 6, 10);
const capeBase = capeGeo.attributes.position.array.slice();
const cape = new THREE.Mesh(capeGeo, M.cape);
cape.position.set(0, 6.8, -1.5);
hero.add(cape);

hero.scale.setScalar(1.15);
hero.visible = false;
scene.add(hero);

// ================= Pita cahaya & sinar =================
const ribbonMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
const ribbon = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1, 8), ribbonMat);
ribbon.visible = false; scene.add(ribbon);
const beamMat = new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.75 });
const beamL = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1, 8), beamMat);
const beamR = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1, 8), beamMat);
beamL.visible = beamR.visible = false; scene.add(beamL, beamR);

const _up = new THREE.Vector3(0, 1, 0), _d = new THREE.Vector3();
function setBeam(mesh, a, b) {
  _d.subVectors(b, a);
  const len = _d.length();
  mesh.position.copy(a).addScaledVector(_d, 0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(_up, _d.normalize());
}

// ================= Kamera & interaksi =================
let dragging = false, lx = 0, ly = 0, dragY = 0, dragX = 0, zoomMul = 1;
const baseZoom = () => 55 * Math.max(1, 1.5 / camera.aspect);
addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  dragY += (e.clientX - lx) * 0.006;
  dragX = Math.max(-0.6, Math.min(0.6, dragX + (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
addEventListener('wheel', e => { zoomMul = Math.max(0.55, Math.min(1.6, zoomMul + e.deltaY * 0.0005)); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================= Animasi =================
const label = document.getElementById('label');
const clock = new THREE.Clock();
const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
const ANCHOR = new THREE.Vector3(-24, 50, 12);   // titik tambat pita (di luar layar)
const FEET_Y = -16, ROPE = ANCHOR.y - FEET_Y;
const tmpHand = new THREE.Vector3(), tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
const goldE = new THREE.Color(0xffb347), redE = new THREE.Color(0x3a0010);
let camZ = baseZoom();

function animate() {
  requestAnimationFrame(animate);
  const T = clock.getElapsedTime() % 16;
  const t = T;

  // ---- fase hati ----
  let apart = 0;
  if (t > 3 && t <= 4.5) apart = sm((t - 3) / 1.5);
  else if (t > 4.5 && t <= 8) apart = 1;
  else if (t > 8 && t <= 11) apart = 1 - sm((t - 8) / 3);
  const heal = sm((t - 8) / 3) * (1 - sm((t - 14) / 2));      // 0..1 cahaya penyembuhan

  const beating = (t < 3 || t > 11);
  const beat = beating ? 1 + Math.pow(Math.max(0, Math.sin(clock.getElapsedTime() * 5)), 8) * 0.06 : 1;
  heart.scale.setScalar(0.9 * beat);

  left.position.x = -apart * 7;  right.position.x = apart * 7;
  left.rotation.z = apart * 0.35; right.rotation.z = -apart * 0.35;
  left.position.y = -apart * 2;   right.position.y = -apart * 2.5;

  heartMat.emissive.copy(redE).lerp(goldE, heal * 0.7);
  heartMat.emissiveIntensity = 0.5 + apart * 0.6 + heal * 0.9;
  healLight.intensity = heal * 2.2;

  // ---- fase pahlawan ----
  let theta = 0, swinging = false;
  hero.visible = (t >= 4 && t < 15);
  if (t >= 4 && t < 7) {
    const k = (t - 4) / 3, e = 1 - Math.pow(1 - k, 3);
    theta = 1.15 * (1 - e); swinging = true;
  } else if (t >= 13 && t < 15) {
    const k = (t - 13) / 2;
    theta = -1.15 * k * k; swinging = true;
  }
  const standW = sm((t - 7) / 0.6) * (1 - sm((t - 12.6) / 0.6));

  hero.position.set(
    ANCHOR.x + ROPE * Math.sin(theta),
    ANCHOR.y - ROPE * Math.cos(theta) + Math.sin(clock.getElapsedTime() * 4) * 0.12 * standW,
    ANCHOR.z
  );
  hero.rotation.z = theta;
  hero.rotation.y = lerp(0.2, 0.6, standW);

  armR.g.rotation.z = lerp(Math.PI + theta, 2.2 + Math.sin(clock.getElapsedTime() * 3) * 0.08, standW);
  armL.g.rotation.z = lerp(-0.4, -2.2, standW);
  legR.rotation.x = lerp(0.7, 0, standW);
  legL.rotation.x = lerp(0.3, 0, standW);
  emblem.rotation.y = clock.getElapsedTime() * 2;

  // jubah berkibar
  {
    const pos = capeGeo.attributes.position, ct = clock.getElapsedTime();
    const flare = lerp(1.4, 0.35, standW);
    for (let i = 0; i < pos.count; i++) {
      const y = capeBase[i * 3 + 1];
      const v = (4 - y) / 8;               // 0 di bahu, 1 di ujung bawah
      pos.setZ(i, Math.sin(ct * 5 + v * 4 + capeBase[i * 3] * 0.5) * 0.5 * v - v * flare);
    }
    pos.needsUpdate = true;
  }

  hero.updateMatrixWorld(true);
  armR.hand.getWorldPosition(tmpHand);

  // pita ayunan
  ribbon.visible = hero.visible && swinging && Math.abs(theta) > 0.03;
  if (ribbon.visible) setBeam(ribbon, tmpHand, ANCHOR);

  // sinar penyatu hati
  const beamOn = t > 7.6 && t < 11.2;
  beamL.visible = beamR.visible = beamOn;
  if (beamOn) {
    heart.updateMatrixWorld(true);
    tmpA.set(left.position.x - 8, left.position.y + 3, 0);
    tmpB.set(right.position.x + 8, right.position.y + 3, 0);
    heart.localToWorld(tmpA); heart.localToWorld(tmpB);
    setBeam(beamL, tmpHand, tmpA);
    setBeam(beamR, tmpHand, tmpB);
    beamMat.opacity = 0.5 + 0.3 * Math.sin(clock.getElapsedTime() * 12);
  }

  // ---- serpihan ----
  const tau = Math.min(Math.max(t - 3.5, 0), 4.5) * 60;
  const conv = sm((t - 8) / 3);
  const vis = (t > 3 && t < 11) ? Math.min(1, Math.max(apart, 0) * 2.5 + (t < 8 ? 0 : 0)) : 0;
  for (let i = 0; i < SHARDS; i++) {
    const d = sd[i];
    let x = d.x + d.vx * tau * 1.0;
    let y = d.y + ((d.vy * tau * 3) % -38);
    let z = d.z + d.vz * tau;
    x = lerp(x, d.tx, conv); y = lerp(y, d.ty, conv); z = lerp(z, d.tz, conv);
    dummy.position.set(x, y, z);
    dummy.rotation.set(d.rx + tau * 0.03, d.ry + tau * 0.025, 0);
    dummy.scale.setScalar(d.s * (t < 8 ? vis : 1) * (1 - conv) * (t > 3 && t < 11 ? 1 : 0));
    dummy.updateMatrix();
    shards.setMatrixAt(i, dummy.matrix);
  }
  shards.instanceMatrix.needsUpdate = true;

  // ---- teks ----
  label.textContent =
    t < 3 ? '' :
    t < 4.5 ? 'Hatinya retak...' :
    t < 7 ? 'Seseorang datang menyelamatkan!' :
    t < 8 ? 'Nova Kiko tiba di lokasi' :
    t < 11 ? 'Menyatukan hati kembali...' :
    t < 13 ? 'Hati utuh lagi \u2764' : '';

  // ---- kamera ----
  const ct = clock.getElapsedTime();
  const ang = dragY + Math.sin(ct * 0.3) * 0.25;
  camZ += (baseZoom() * zoomMul - camZ) * 0.1;
  camera.position.set(Math.sin(ang) * camZ, dragX * camZ * 0.6, Math.cos(ang) * camZ);
  camera.lookAt(0, -2, 0);
  key.position.x = Math.sin(ct * 0.6) * 30;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
